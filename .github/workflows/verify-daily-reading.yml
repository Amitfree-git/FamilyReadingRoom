name: Verify daily reading
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/content.js
          node --check docs/illustrations.js
      - name: Validate 30 contextual lessons and source references
        run: |
          node <<'NODE'
          const fs=require('node:fs'), vm=require('node:vm'), assert=require('node:assert/strict');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('docs/content.js','utf8'),context);
          const data=context.window.CLASSICS_DATA;
          assert.equal(data.lessons.length,30);
          assert.equal(data.version,'2.0.0');
          for(const l of data.lessons){
            assert.ok(l.quote && l.focus && l.plain && l.kid,l.id+' fields');
            assert.ok(l.quote.length>l.focus.length,l.id+' passage must exceed focus');
            assert.ok(l.quote.length>=30,l.id+' passage too short');
            assert.ok(l.refs.every(id=>data.sources[id]),l.id+' missing source');
            assert.ok(l.passageType,l.id+' missing type');
          }
          const app=fs.readFileSync('docs/app.js','utf8');
          assert.ok(app.includes('本课精读一句'));
          assert.ok(app.includes('l.quote.split(/\\n+/)'));
          assert.ok(!app.includes("if(l.id==='c01')lines"));
          const html=fs.readFileSync('docs/index.html','utf8');
          assert.ok(html.includes('每日一段'));
          console.log('Validated',data.lessons.length,'daily passages');
          NODE
      - name: Check scene-specific watercolor illustrations
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('docs/content.js','utf8'),context);
          vm.runInNewContext(fs.readFileSync('docs/illustrations.js','utf8'),context);
          const lessons=context.window.CLASSICS_DATA.lessons;
          const art=context.window.ClassicIllustrations;
          assert.equal(lessons.length,30);
          assert.ok(art && typeof art.cover==='function' && typeof art.artStrip==='function');
          assert.ok(art.paintedLessons && typeof art.paintedLessons.has==='function');
          const known=new Set(lessons.map(l=>l.id));
          for(const id of art.paintedLessons){
            assert.ok(known.has(id),'painted lesson missing from curriculum: '+id);
          }
          if(art.paintedLessons.has('c01')){
            const paths=['docs/art/c01-hero-native.webp',...Array.from({length:4},(_,i)=>'docs/art/c01-scene-0'+(i+1)+'-native.webp')];
            for(const path of paths){
              assert.ok(fs.existsSync(path),'original WebP missing: '+path);
              const content=fs.readFileSync(path);
              assert.equal(content.toString('ascii',0,4),'RIFF',path+' RIFF magic');
              assert.equal(content.toString('ascii',8,12),'WEBP',path+' WEBP magic');
              assert.ok(content.length>40_000,path+' unexpectedly small');
            }
            assert.ok(fs.statSync(paths[0]).size>300_000,'hero must be real source image');
          }
          for(const l of lessons){
            const cover=art.cover(l),panels=art.artStrip(l);
            if(art.paintedLessons.has(l.id)){
              assert.ok(cover.includes('role="img"') && cover.includes('aria-label='),l.id+' cover accessibility');
              assert.ok(panels.includes('role="img"') && panels.includes('aria-label='),l.id+' panel accessibility');
              assert.equal((panels.match(/<figure\b/g)||[]).length,Math.min(4,l.story.parts.length),l.id+' storyboard');
              assert.ok(cover.includes('painting-hero'),l.id+' painted cover');
              assert.ok(cover.includes('c01-hero-native.webp'),l.id+' uses source-resolution hero');
              assert.ok(panels.includes('c01-scene-04-native.webp'),l.id+' uses independent story panels');
              assert.ok(cover.includes('story-dialogue-hero'),l.id+' has labeled hero dialogue');
              assert.ok(panels.includes('story-dialogue-panel'),l.id+' has labeled panel dialogue');
              assert.ok(panels.includes('</div><figcaption class="painting-caption">'),l.id+' image closes before captions and dialogue');
              assert.ok(cover.includes('<figcaption class="painting-cover-notes">'),l.id+' hero dialogue is in caption');
              const styles=fs.readFileSync('docs/styles.css','utf8');
              assert.ok(styles.includes('.painted-gallery .story-dialogue-panel{display:flex;position:static'),l.id+' panel dialogue not over image');
              assert.ok(styles.includes('grid-template-columns:1fr;gap:15px'),l.id+' mobile uses readable full-width panels');
              assert.ok(styles.includes('object-fit:contain'),l.id+' image keeps original aspect ratio');
              assert.ok(panels.includes('管仲有治理国家的才能'),l.id+' dialogue is accurate edited text');
              assert.ok(cover.includes('对白根据故事情节改编') && cover.includes('并非古籍逐字原话'),l.id+' distinguishes paraphrase from source quote');
            }else{
              assert.equal(cover,'',l.id+' must not reuse generic artwork');
              assert.equal(panels,'',l.id+' must not reuse generic artwork');
            }
            for(const markup of [cover,panels]){
              assert.ok(!/<script\b/i.test(markup),l.id+' no embedded scripts');
              assert.ok(!/\b(?:src|href)\s*=\s*["']\s*(?:https?:|\/\/)/i.test(markup),l.id+' no external image links');
              assert.ok(!/\bon\w+\s*=/i.test(markup),l.id+' no event-handler attributes');
            }
          }
          const html=fs.readFileSync('docs/index.html','utf8');
          assert.ok(/src="illustrations\.js(?:\?[^" ]+)?"/.test(html),'illustrations script referenced');
          assert.ok(html.indexOf('src="illustrations.js')<html.indexOf('src="app.js"'),'script loading order');
          console.log('Pass: all',lessons.length,'lessons checked;',art.paintedLessons.size,'have dedicated artwork');
          NODE
