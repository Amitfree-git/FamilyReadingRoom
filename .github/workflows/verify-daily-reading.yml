name: Verify daily reading
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/content.js
          node --check docs/illustrations.js
      - name: Validate 30 contextual lessons and source references
        run: |
          node <<'NODE'
          const fs=require('node:fs'), vm=require('node:vm'), assert=require('node:assert/strict');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('docs/content.js','utf8'),context);
          const data=context.window.CLASSICS_DATA;
          assert.equal(data.lessons.length,30);
          assert.equal(data.version,'2.0.0');
          for(const l of data.lessons){
            assert.ok(l.quote && l.focus && l.plain && l.kid,l.id+' fields');
            assert.ok(l.quote.length>l.focus.length,l.id+' passage must exceed focus');
            assert.ok(l.quote.length>=30,l.id+' passage too short');
            assert.ok(l.refs.every(id=>data.sources[id]),l.id+' missing source');
            assert.ok(l.passageType,l.id+' missing type');
          }
          const app=fs.readFileSync('docs/app.js','utf8');
          assert.ok(app.includes('本课精读一句'));
          assert.ok(app.includes('l.quote.split(/\\n+/)'));
          assert.ok(!app.includes("if(l.id==='c01')lines"));
          const html=fs.readFileSync('docs/index.html','utf8');
          assert.ok(html.includes('每日一段'));
          console.log('Validated',data.lessons.length,'daily passages');
          NODE
      - name: Check integrated comic poster and fallback accessibility
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('docs/content.js','utf8'),context);
          vm.runInNewContext(fs.readFileSync('docs/illustrations.js','utf8'),context);
          const lessons=context.window.CLASSICS_DATA.lessons;
          const art=context.window.ClassicIllustrations;
          assert.equal(lessons.length,30);
          assert.equal(art.paintedLessons.size,1);
          assert.ok(art.paintedLessons.has('c01'));
          assert.equal(typeof art.cover,'function');
          assert.equal(typeof art.artStrip,'function');
          const path='docs/art/c01-full-lecture.webp',bytes=fs.readFileSync(path);
          assert.equal(bytes.toString('ascii',0,4),'RIFF');
          assert.equal(bytes.toString('ascii',8,12),'WEBP');
          assert.ok(bytes.length>600000,'keep detailed full-resolution poster');
          for(const l of lessons){
            const cover=art.cover(l),panels=art.artStrip(l);
            if(l.id==='c01'){
              assert.ok(cover.includes('src="art/c01-full-lecture.webp"'),'poster source');
              assert.ok(cover.includes('width="1774" height="887"'),'original image dimensions');
              assert.ok(cover.includes('查看原图'),'zoom link available');
              assert.ok(cover.includes('role="region"')&&cover.includes('alt='),'accessible artwork');
              assert.ok(cover.includes('文字误差'),'AI-text disclaimer');
              assert.equal(panels,'','do not duplicate text overlays on existing poster');
            } else {
              assert.equal(cover,'',l.id+' must have no reused art');
              assert.equal(panels,'',l.id+' must have no reused art');
            }
            assert.ok(!/<script\b/i.test(cover),l.id+' embedded scripts');
            assert.ok(!/\bon\w+\s*=/i.test(cover),l.id+' no injected handlers');
          }
          const app=fs.readFileSync('docs/app.js','utf8');
          const html=fs.readFileSync('docs/index.html','utf8');
          const css=fs.readFileSync('docs/styles.css','utf8');
          assert.ok(app.includes("cover(l):''}<div class=\"layout\""),'poster must be full-width before lesson two-column layout');
          assert.ok(html.indexOf('src="illustrations.js')<html.indexOf('src="app.js'),'script order');
          assert.ok(css.includes('.picture-scroll img{width:940px;max-width:none'),'mobile should pan at legible scale');
          assert.ok(css.includes('.picture-scroll{width:100%;max-width:100%;overflow-x:auto'),'scroll is confined to image');
          console.log('Pass: source-resolution illustrated lecture and 29 proper fallbacks');
          NODE
