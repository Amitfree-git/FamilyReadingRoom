name: Verify daily reading
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/content.js
          node --check docs/illustrations.js
      - name: Validate 30 contextual lessons and source references
        run: |
          node <<'NODE'
          const fs=require('node:fs'), vm=require('node:vm'), assert=require('node:assert/strict');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('docs/content.js','utf8'),context);
          const data=context.window.CLASSICS_DATA;
          assert.equal(data.lessons.length,30);
          assert.equal(data.version,'2.0.0');
          for(const l of data.lessons){
            assert.ok(l.quote && l.focus && l.plain && l.kid,l.id+' fields');
            assert.ok(l.quote.length>l.focus.length,l.id+' passage must exceed focus');
            assert.ok(l.quote.length>=30,l.id+' passage too short');
            assert.ok(l.refs.every(id=>data.sources[id]),l.id+' missing source');
            assert.ok(l.passageType,l.id+' missing type');
          }
          const app=fs.readFileSync('docs/app.js','utf8');
          assert.ok(app.includes('本课精读一句'));
          assert.ok(app.includes('l.quote.split(/\\n+/)'));
          assert.ok(!app.includes("if(l.id==='c01')lines"));
          const html=fs.readFileSync('docs/index.html','utf8');
          assert.ok(html.includes('每日一段'));
          console.log('Validated',data.lessons.length,'daily passages');
          NODE
      - name: Check illustrated lessons and fallback accessibility
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('docs/content.js','utf8'),context);
          vm.runInNewContext(fs.readFileSync('docs/illustrations.js','utf8'),context);
          const illustrations=context.window.ClassicIllustrations,lessons=context.window.CLASSICS_DATA.lessons;
          assert.equal(Object.keys(illustrations.episodes).length,30);
          assert.equal(lessons.length,30);
          for(const l of lessons){
            assert.equal(illustrations.episodes[l.id].length,l.story.parts.length,l.id+' scene count');
            const hero=illustrations.cover(l);
            const panels=illustrations.artStrip(l);
            assert.ok(hero.includes('<svg')&&hero.includes('aria-label'),l.id+' cover accessible');
            assert.equal((panels.match(/<figure/g)||[]).length,l.story.parts.length,l.id+' panels');
            assert.ok(panels.includes(l.story.parts[0][0]),l.id+' first scene');
            assert.ok(!/\b(?:href|src)\s*=\s*["']https?:\/\//.test(panels),l.id+' must work offline');
            assert.ok(!panels.includes('<script'),l.id+' unsafe content');
          }
          const html=fs.readFileSync('docs/index.html','utf8');
          const app=fs.readFileSync('docs/app.js','utf8');
          assert.ok(html.indexOf('src="illustrations.js"')<html.indexOf('src="app.js"'));
          assert.ok(app.includes('ClassicIllustrations.cover'));
          assert.ok(app.includes('ClassicIllustrations.artStrip'));
          console.log('Checked watercolor cover and comic scenes for all',lessons.length,'lessons');
          NODE
